# =============================================================================
# Docker Compose Local - Asociación Tyto Alba
# =============================================================================
# Para desarrollo local con PostgreSQL propio
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Base de datos local para desarrollo
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tytoalba-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tytoalba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tytoalba}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5433:5432"  # Puerto diferente para evitar conflictos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tytoalba} -d ${POSTGRES_DB:-tytoalba}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tytoalba-network

  # ---------------------------------------------------------------------------
  # App Nuxt.js
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tytoalba-app-local
    restart: unless-stopped
    environment:
      # Base de datos local
      DATABASE_URL: postgresql://${POSTGRES_USER:-tytoalba}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tytoalba}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-tytoalba}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tytoalba}?schema=public
      
      # Indicar que usamos PostgreSQL nativo
      DB_ADAPTER: pg
      
      # Seguridad
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-local_development_key_32chars_long}
      
      # OAuth Google (opcional)
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      
      # Entorno
      NODE_ENV: development
      NUXT_TELEMETRY_DISABLED: 1
      
      # Host
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    
    # Puerto expuesto solo para desarrollo local
    ports:
      - "127.0.0.1:3001:3000"
    
    volumes:
      - ./uploads:/app/uploads
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - tytoalba-network
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# -----------------------------------------------------------------------------
# Volúmenes persistentes
# -----------------------------------------------------------------------------
volumes:
  postgres_data_local:
    driver: local

# -----------------------------------------------------------------------------
# Redes
# -----------------------------------------------------------------------------
networks:
  tytoalba-network:
    driver: bridge
