# =============================================================================
# Docker Compose - Asociación Tyto Alba
# =============================================================================
# Usa PostgreSQL compartido (shared-postgres) en lugar de instancia propia
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # App Nuxt.js
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tytoalba-app
    restart: unless-stopped
    environment:
      # Base de datos: usar shared-postgres (postgres compartido)
      DATABASE_URL: postgresql://${DB_USER:-tytoalba_app}:${DB_PASSWORD}@${DB_HOST:-shared-postgres}:5432/${DB_NAME:-tytoalba}?schema=public
      DIRECT_URL: postgresql://${DB_USER:-tytoalba_app}:${DB_PASSWORD}@${DB_HOST:-shared-postgres}:5432/${DB_NAME:-tytoalba}?schema=public
      
      # Indicar que usamos PostgreSQL nativo (no Neon)
      DB_ADAPTER: pg
      
      # Seguridad
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      
      # OAuth Google (opcional)
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      
      # Entorno
      NODE_ENV: production
      NUXT_TELEMETRY_DISABLED: 1
      
      # Host
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    
    # Nota: Puerto no expuesto - Caddy hace de proxy inverso
    # Caddy se comunica mediante la red interna caddy-network
    
    volumes:
      - tytoalba_uploads:/app/uploads
    
    networks:
      - tytoalba-network
      - caddy-network      # Para que Caddy pueda hacer proxy
      - postgres-network   # Para conectarse a shared-postgres
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# -----------------------------------------------------------------------------
# Volúmenes persistentes
# -----------------------------------------------------------------------------
volumes:
  tytoalba_uploads:
    driver: local

# -----------------------------------------------------------------------------
# Redes
# -----------------------------------------------------------------------------
networks:
  tytoalba-network:
    driver: bridge
  caddy-network:
    external: true
  postgres-network:
    external: true  # Red externa donde está shared-postgres
